[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foss-fincalc"
version = "1.1.0"
authors = [
  { name="ananthicoder-debug", email="ananthigomathi202006@gmail.com" },
]
description = "Open Source Financial and Loan Analytics Package"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]

[project.scripts]
foss-fincalc = "foss_fincalc.cli:main"
